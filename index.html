<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rapli vs Dapa & Yudis & Dani</title>
<style>
:root{--bg:#10030d;--red:#ff3d50;--ember:#ffad44;--acid:#80ff47;--violet:#a666ff;--ink:#080008}*{box-sizing:border-box}body{margin:0;overflow:hidden;min-height:100svh;background:radial-gradient(ellipse at 50% 120%,#8f1c16 0%,#250615 38%,#070309 80%);color:#fff;font-family:Rajdhani,Arial,sans-serif}#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0}.scan{position:fixed;inset:0;pointer-events:none;z-index:9;background:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 4px);mix-blend-mode:soft-light}.stage{position:relative;z-index:1;min-height:100svh;display:grid;place-items:center;padding:16px}.arena{width:min(900px,96vw);height:min(650px,92svh);min-height:540px;position:relative;overflow:hidden;border:1px solid rgba(255,109,109,.38);border-radius:18px;background:linear-gradient(180deg,rgba(44,6,27,.38),rgba(6,0,8,.45));box-shadow:0 25px 90px #000,inset 0 0 80px rgba(255,28,45,.08)}
.arena:before{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 48%,rgba(255,255,255,.09) 50%,transparent 52%);transform:translateX(-150%);animation:shine 7s ease-in-out infinite}@keyframes shine{30%,100%{transform:translateX(150%)}}.hud{position:absolute;inset:0 0 auto;z-index:4;padding:19px 22px;display:flex;justify-content:space-between;gap:18px}.fighter-hud{width:37%;text-transform:uppercase}.fighter-hud.right{text-align:right}.label{font-family:'Black Ops One',Impact,sans-serif;letter-spacing:1px;font-size:clamp(15px,2vw,21px);text-shadow:2px 2px #000}.label em{font:700 11px Rajdhani,sans-serif;color:#d6b5ff;letter-spacing:2px;display:block}.bar{height:12px;margin-top:5px;border:2px solid #c9bdc3;background:#210710;box-shadow:0 0 8px #000}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff3348,#ffbf53);box-shadow:0 0 13px #ff3045;transition:width .45s}.right .bar i{margin-left:auto;background:linear-gradient(90deg,#75ff47,#c5ff77);box-shadow:0 0 13px #60ff43}.versus{position:absolute;z-index:4;top:18px;left:50%;transform:translateX(-50%);font-family:'Black Ops One',Impact,sans-serif;color:#ffcb64;font-size:clamp(26px,5vw,42px);font-style:italic;text-shadow:3px 3px #570615,0 0 18px #f45037}.sky-title{position:absolute;z-index:2;top:114px;width:100%;text-align:center;letter-spacing:7px;font:700 11px Rajdhani,sans-serif;color:#ffb0b0;text-transform:uppercase;opacity:.72}.ground{position:absolute;left:-5%;right:-5%;bottom:-7%;height:38%;border-radius:50% 50% 0 0;background:radial-gradient(ellipse at 50% 20%,#811618 0 4%,#27040c 33%,#060108 72%);border-top:2px solid rgba(255,101,55,.55);box-shadow:0 -12px 45px #d62520,inset 0 20px 80px #000}.sigil{position:absolute;left:50%;bottom:11%;width:380px;max-width:75vw;aspect-ratio:1;transform:translateX(-50%);border:2px solid rgba(255,82,70,.5);border-radius:50%;box-shadow:0 0 30px #f3362e,inset 0 0 28px #f3362e;opacity:.8;animation:spin 13s linear infinite}.sigil:before,.sigil:after{content:'';position:absolute;inset:16%;border:1px solid #ff8d64;transform:rotate(45deg)}.sigil:after{inset:4%;border-style:dashed;transform:rotate(0)}@keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}
.fighter{position:absolute;z-index:3;bottom:15%;width:145px;height:260px;filter:drop-shadow(0 14px 9px #000);transform-origin:bottom}.fighter .head{position:absolute;top:28px;left:48px;width:57px;height:60px;border-radius:45% 45% 47% 47%;background:#f1bdac;border:3px solid #240713;z-index:2}.fighter .body{position:absolute;top:80px;left:35px;width:86px;height:125px;border:4px solid #1c0610;border-radius:35px 35px 18px 18px;z-index:1}.fighter .arm{position:absolute;top:101px;width:68px;height:19px;border-radius:14px;transform-origin:10px 50%;z-index:0}.fighter .leg{position:absolute;top:193px;width:25px;height:68px;border-radius:0 0 10px 10px;border:3px solid #190510}.fighter .leg.a{left:49px;transform:rotate(7deg)}.fighter .leg.b{left:84px;transform:rotate(-7deg)}.fighter .tag{position:absolute;top:-3px;left:50%;transform:translateX(-50%);white-space:nowrap;text-align:center;font:700 11px Rajdhani,sans-serif;letter-spacing:1.3px;text-shadow:1px 2px #000}.fighter .tag small{display:block;font-size:9px;color:#c8b5e8}.rapli{left:16%;animation:stance .7s ease-in-out infinite alternate}.rapli .head{background:linear-gradient(145deg,#dfaa95,#f8d1c0)}.rapli .head:before{content:'';position:absolute;left:-12px;top:-25px;width:77px;height:42px;background:linear-gradient(145deg,#17172d,#51427d);clip-path:polygon(0 74%,13% 12%,28% 52%,47% 0,64% 49%,88% 10%,100% 76%);filter:drop-shadow(0 0 7px #a571ff)}.rapli .body,.rapli .leg{background:linear-gradient(90deg,#17132e,#503d7e)}.rapli .arm{background:#48356e}.rapli .arm.a{left:-22px;transform:rotate(22deg)}.rapli .arm.b{right:-22px;transform:rotate(-29deg)}.rapli .blade{position:absolute;width:110px;height:12px;top:88px;left:95px;z-index:4;transform:rotate(-15deg);background:linear-gradient(90deg,#5d4b92,#eae9ff,#795ded);clip-path:polygon(0 18%,86% 0,100% 50%,86% 100%,0 82%);box-shadow:0 0 15px #a288ff}.rapli .blade:after{content:'';position:absolute;left:-18px;top:-6px;width:25px;height:24px;background:#ffb64c;clip-path:polygon(0 42%,100% 0,71% 50%,100% 100%)}@keyframes stance{to{transform:translateY(-8px) skewX(-2deg)}}
.enemy{right:14%;bottom:16%;transform:scale(.88)}.enemy .head{background:#a17781}.enemy .body,.enemy .leg{background:linear-gradient(90deg,#2a0717,#68123c)}.enemy .arm{background:#5d1038}.enemy .arm.a{left:-24px;transform:rotate(28deg)}.enemy .arm.b{right:-27px;transform:rotate(-32deg)}.enemy .horn{position:absolute;top:10px;width:30px;height:39px;background:#211023;clip-path:polygon(0 100%,20% 0,100% 100%);z-index:3}.enemy .horn.l{left:39px;transform:rotate(-19deg)}.enemy .horn.r{right:35px;transform:rotate(19deg)}.enemy .tail{position:absolute;right:-56px;top:160px;width:72px;height:75px;border-right:8px solid #701842;border-bottom:8px solid #701842;border-radius:0 0 70% 0;transform:rotate(-35deg)}.enemy:after{content:'DEVIL • YUDIS & DANI';position:absolute;bottom:-24px;white-space:nowrap;font:700 11px Rajdhani,sans-serif;letter-spacing:1px;color:#ffbad6}.azazel{right:2%;bottom:13%;transform:scale(.68);filter:drop-shadow(0 0 14px #5bff3e)}.azazel .head{background:#a1c88a}.azazel .body,.azazel .leg{background:linear-gradient(90deg,#17351d,#357c34)}.azazel .arm{background:#367c36}.azazel .horn{position:absolute;top:6px;width:33px;height:42px;background:#1b5d2c;clip-path:polygon(0 100%,20% 0,100% 100%);z-index:3}.azazel .horn.l{left:38px;transform:rotate(-21deg)}.azazel .horn.r{right:35px;transform:rotate(21deg)}.azazel:after{content:'AZAZEL • DAPA';position:absolute;bottom:-29px;white-space:nowrap;font:700 11px Rajdhani,sans-serif;letter-spacing:1px;color:#9aff7c}
.fight-btn{position:absolute;z-index:8;bottom:22px;left:50%;transform:translateX(-50%);border:1px solid #ffbd61;border-radius:5px;padding:12px 22px;cursor:pointer;color:#1d0308;background:linear-gradient(90deg,#ff7f43,#ffe17d);font:700 14px Rajdhani,sans-serif;letter-spacing:2px;text-transform:uppercase;box-shadow:0 0 20px #f44530;transition:.2s}.fight-btn:hover{filter:brightness(1.18);transform:translateX(-50%) scale(1.06)}.announcement{position:absolute;z-index:7;top:45%;left:50%;transform:translate(-50%,-50%) scale(.7);width:100%;text-align:center;font-family:'Black Ops One',Impact,sans-serif;font-size:clamp(36px,7vw,76px);letter-spacing:2px;color:#fff1bf;text-shadow:4px 4px #9f1021,0 0 25px #ff472e;opacity:0;pointer-events:none}.announcement.show{animation:announce 1.25s ease-out}@keyframes announce{18%,70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.2)}}.slash{position:fixed;z-index:10;height:9px;border-radius:9px;background:linear-gradient(90deg,transparent,#fff7a9,#ff392f,transparent);box-shadow:0 0 20px #ff302d;pointer-events:none;animation:slash .42s ease-out forwards}@keyframes slash{from{transform:rotate(var(--r)) scaleX(.1);opacity:1}to{transform:rotate(var(--r)) scaleX(1.4);opacity:0}}.hit{animation:hit .45s ease}.dash{animation:dash .55s cubic-bezier(.1,.7,.4,1) forwards}@keyframes hit{30%{transform:translate(16px,-10px) rotate(7deg)}100%{transform:translateX(0)}}@keyframes dash{50%{transform:translate(240px,-38px) scale(1.12)}100%{transform:translateX(0)}}
@media(max-width:600px){.arena{min-height:570px}.hud{padding:16px 12px}.fighter-hud{width:39%}.sky-title{top:106px}.rapli{left:8%;transform:scale(.84)}.enemy{right:5%;transform:scale(.73)}.azazel{right:-8%;transform:scale(.53)}}
</style></head><body><canvas id="fx"></canvas><div class="scan"></div><main class="stage"><section class="arena" id="arena"><div class="hud"><div class="fighter-hud"><div class="label">Rapli <em>Jin Sasinmu</em></div><div class="bar"><i id="hp1"></i></div></div><div class="fighter-hud right"><div class="label">Yudis & Dani & Dapa <em>Devil + Azazel</em></div><div class="bar"><i id="hp2"></i></div></div></div><div class="versus">VS</div><div class="sky-title">Infernal Arena · Lost Saga fan battle</div><div class="ground"></div><div class="sigil"></div><div class="fighter rapli" id="rapli"><div class="tag">RAPLI<small>JIN SASINMU</small></div><div class="head"></div><div class="body"></div><div class="arm a"></div><div class="arm b"></div><div class="leg a"></div><div class="leg b"></div><div class="blade"></div></div><div class="fighter enemy" id="yudis"><div class="horn l"></div><div class="horn r"></div><div class="head"></div><div class="body"></div><div class="arm a"></div><div class="arm b"></div><div class="leg a"></div><div class="leg b"></div><div class="tail"></div></div><div class="fighter azazel" id="dapa"><div class="horn l"></div><div class="horn r"></div><div class="head"></div><div class="body"></div><div class="arm a"></div><div class="arm b"></div><div class="leg a"></div><div class="leg b"></div></div><div class="announcement" id="announce">FATAL COMBO!</div><button class="fight-btn" id="fight">FIGHT ⚔</button></section></main><script>
const cv=document.querySelector('#fx'),ctx=cv.getContext('2d');let p=[];function resize(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);p=Array.from({length:90},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,v:1+Math.random()*2,s:1+Math.random()*3,a:Math.random()}))}resize();addEventListener('resize',resize);function particles(){ctx.clearRect(0,0,innerWidth,innerHeight);p.forEach(q=>{q.y-=q.v;q.x+=Math.sin(q.y*.01)*.28;if(q.y<0){q.y=innerHeight;q.x=Math.random()*innerWidth}ctx.globalAlpha=.2+q.a*.45;ctx.fillStyle=q.a>.55?'#ff7c37':'#db2331';ctx.fillRect(q.x,q.y,q.s,q.s*2)});requestAnimationFrame(particles)}particles();
let round=0;const fight=document.querySelector('#fight'),rapli=document.querySelector('#rapli'),yudis=document.querySelector('#yudis'),dapa=document.querySelector('#dapa'),hp2=document.querySelector('#hp2'),announce=document.querySelector('#announce');function slash(){let s=document.createElement('i');s.className='slash';s.style.width=(180+Math.random()*240)+'px';s.style.left=(innerWidth*.3+Math.random()*innerWidth*.4)+'px';s.style.top=(innerHeight*.38+Math.random()*innerHeight*.2)+'px';s.style.setProperty('--r',(-30+Math.random()*60)+'deg');document.body.append(s);setTimeout(()=>s.remove(),450)}fight.onclick=()=>{round++;rapli.classList.remove('dash');void rapli.offsetWidth;rapli.classList.add('dash');[0,140,260,390].forEach(t=>setTimeout(slash,t));setTimeout(()=>{yudis.classList.remove('hit');dapa.classList.remove('hit');void yudis.offsetWidth;yudis.classList.add('hit');dapa.classList.add('hit');const hp=Math.max(0,100-round*34);hp2.style.width=hp+'%';announce.textContent=hp?'INFERNO COMBO!':'RAPLI WINS!';announce.classList.remove('show');void announce.offsetWidth;announce.classList.add('show');fight.textContent=hp?'COMBO LAGI ⚔':'REMATCH ⚔'},440)};
</script></body></html>
